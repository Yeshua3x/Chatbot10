<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot da Empresa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #chatContainer {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 350px;
            overflow: hidden;
        }
        #chatbox {
            border: none;
            padding: 15px;
            background: #f9f9f9;
            height: 400px;
            overflow-y: scroll;
        }
        #userInput {
            width: calc(100% - 90px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 0 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            background: #00796b;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #004d40;
        }
        .message {
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .user {
            background: #bbdefb;
            text-align: right;
        }
        .bot {
            background: #c8e6c9;
            text-align: left;
        }
    </style>
</head>
<body>

    <div id="chatContainer">
        <h1 style="text-align: center;">Chatbot da Empresa</h1>
        <div id="chatbox"></div>
        <div style="display: flex; padding: 10px;">
            <input type="text" id="userInput" placeholder="Digite sua pergunta..." />
            <button onclick="processInput()">Enviar</button>
        </div>
    </div>

    <script>
        let data;

        // Carrega o JSON do arquivo data.json
        fetch('data.json')
            .then(response => response.json())
            .then(jsonData => {
                data = jsonData;
                showWelcomeMessage();
            });

        function showWelcomeMessage() {
            const welcomeMessage = `Olá! Nós somos da ${data.empresa.nome}. Como podemos ajudar você hoje?`;
            const chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += `<div class="message bot">${welcomeMessage}</div>`;
            chatbox.scrollTop = chatbox.scrollHeight; // Scroll para baixo
        }

        function processInput() {
            const userInput = document.getElementById("userInput").value;
            const chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += `<div class="message user">${userInput}</div>`;
            document.getElementById("userInput").value = "";

            const response = handleUserInput(userInput);
            chatbox.innerHTML += `<div class="message bot">${response}</div>`;
            chatbox.scrollTop = chatbox.scrollHeight; // Scroll para baixo
        }

        function handleUserInput(input) {
            const normalizedInput = input.toLowerCase();

            for (const keyword of Object.keys(data.empresa.respostas)) {
                // Se a palavra-chave estiver contida na entrada do usuário
                if (normalizedInput.includes(keyword)) {
                    return data.empresa.respostas[keyword];
                }
            }
            return "Desculpe, não entendi a sua pergunta. Tente novamente!";
        }
    </script>
</body>
</html>
